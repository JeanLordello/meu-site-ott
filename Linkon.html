<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plataforma OTT</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <style>
      /* Estilos personalizados */
      body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
      }
      .header {
        text-align: center;
        padding: 50px;
        background-color: #343a40;
        color: white;
      }
      .container {
        margin-top: 20px;
      }
      .card {
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <!-- Cabeçalho -->
    <div class="header">
      <h1>Bem-vindo à LinkonTV</h1>
      <p>
        Assista aos seus canais, filmes e séries favoritos em qualquer lugar!
      </p>
    </div>

    <!-- Catálogo de Conteúdo -->
    <div class="container">
      <div class="row">
        <!-- Vídeo 1 -->
        <div class="col-md-4">
          <div class="card">
            <img
              src="https://photos.fife.usercontent.google.com/pw/AP1GczMTi-sKIV60avBIfEgSRQhIAOYr0nIrqW40xmsg9KpCAcCYi7ue4rk=w300-h200-s-no-gm?authuser=2"
              class="card-img-top"
              alt="Imagem do vídeo 1"
            />
            <div class="card-body">
              <h5 class="card-title">TV ao vivo</h5>
              <p class="card-text">Descrição curta do vídeo 1.</p>
            </div>
          </div>
        </div>
        <!-- Vídeo 2 -->
        <div class="col-md-4">
          <div class="card">
            <img
              src="https://photos.fife.usercontent.google.com/pw/AP1GczMTi-sKIV60avBIfEgSRQhIAOYr0nIrqW40xmsg9KpCAcCYi7ue4rk=w300-h200-s-no-gm?authuser=2"
              class="card-img-top"
              alt="Imagem do vídeo 2"
            />
            <div class="card-body">
              <h5 class="card-title">FIlmes</h5>
              <p class="card-text">Descrição curta do vídeo 2.</p>
            </div>
          </div>
        </div>
        <!-- Vídeo 3 -->
        <div class="col-md-4">
          <div class="card">
            <img
              src="https://photos.fife.usercontent.google.com/pw/AP1GczMTi-sKIV60avBIfEgSRQhIAOYr0nIrqW40xmsg9KpCAcCYi7ue4rk=w300-h200-s-no-gm?authuser=2"
              class="card-img-top"
              alt="Imagem do vídeo 3"
            />
            <div class="card-body">
              <h5 class="card-title">Séries</h5>
              <p class="card-text">Descrição curta do vídeo 3.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
